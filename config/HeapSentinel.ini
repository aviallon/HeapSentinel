; HeapSentinel - Data/SKSE/Plugins/HeapSentinel.ini
; Every value here is the compiled-in default; delete the file to use them.

[General]
; Master switch. 0 installs nothing at all.
bEnabled=1

[Ledger]
; Shadow allocation ledger: ptr -> {size, thread, alloc/free site, stacks}.
; Fail-open: when it is full or not ready, every hook passes through.
bEnabled=1
; One entry per live allocation. Skyrim has well over a million live engine
; allocations, so the default is 4 M (1<<22). The table is bounded: probing
; stops after 64 slots and the oldest freed entry is evicted when it is full.
uCapacity=4194304
uShards=64
; Frames captured per alloc/free. 0 keeps only the immediate return address.
uStackDepth=12

[GuardPool]
; GWP-ASan-style sampled allocations with guard pages. OPT-IN: a sampled block
; was never returned by any engine heap, so the engine must never inspect it
; with ContainsBlockImpl/Size. The hooks route frees and reallocs of our blocks
; back to us, but that is the whole safety argument.
bEnabled=0
; 1 in N allocations is sampled.
uSampleRate=2000
uSlots=64
; Requests larger than this pass straight through (one data page per slot).
uMaxSize=3072
; 1 = on a guarded-slot fault, re-protect the page and let the game continue.
bFixUp=1

[RefCountGuard]
; Validate the vtable before GRefCountImpl::Release dispatches a destructor.
bEnabled=1
; 0 = log and let the engine do what it was going to do (it will probably
;     crash, but nothing is hidden).
; 1 = skip the dispatch entirely, turning the crash into a leak.
bFailSafe=0

[Reporting]
bScreenshot=0
bFreeze=0
bVeh=1
; Untracked frees are not necessarily invalid (allocations made before the
; hooks were installed are untracked too), so this is off by default.
bReportUntrackedFree=0
uMaxReportsPerSecond=20
