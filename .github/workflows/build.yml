name: build

# Builds HeapSentinel.dll for Skyrim AE 1.7.104 with xmake + CommonLibSSE-NG.
#
# The whole portability story is CommonLibSSE-NG + the Address Library: every
# engine target in src/Hooks/Hooks.cpp is a REL::RelocationID(se, ae) pair, so
# SE/AE/VR selection is the library's job. The pinned CommonLibSSE-NG revision
# is the one whose include/REL/IDDB.h defines Format::SSEv5, i.e. it can read
# the 1.7.104 Address Library (versionlib-1-7-104-0.bin, format 5). CI asserts
# that before compiling, so a green run cannot come from the wrong reader.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  COMMONLIB_COMMIT: abe9ca7b7318dbc04bccfcd59fc3fb670244c2d7
  XMAKE_GLOBALDIR: ${{ github.workspace }}/.xmake-global

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin CommonLibSSE-NG to the format-5 revision
        shell: bash
        run: |
          set -euo pipefail
          cd lib/CommonLibSSE-NG
          git fetch --depth 1 origin "$COMMONLIB_COMMIT"
          git checkout --detach "$COMMONLIB_COMMIT"
          git log --oneline -1
          test -f include/REL/IDDB.h || { echo "::error::IDDB.h missing - wrong revision"; exit 1; }
          grep -q "SSEv5" include/REL/IDDB.h || { echo "::error::no SSEv5 in IDDB.h"; exit 1; }
          echo "format-5 Address Library reader present in the pinned revision"

      - name: Pin MinHook
        shell: bash
        run: |
          set -euo pipefail
          cd lib/minhook
          git log --oneline -1
          test -f include/MinHook.h || { echo "::error::MinHook.h missing"; exit 1; }
          test -f src/hde/hde64.c || { echo "::error::hde64.c missing"; exit 1; }

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.xmake-global
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      - name: Build HeapSentinel.dll
        shell: pwsh
        run: |
          # The xmake-mirror sometimes answers 504 while fetching a prebuilt
          # package (directxtk); retry the configure step instead of failing.
          $ok = $false
          for ($i = 1; $i -le 8; $i++) {
            xmake f -p windows -a x64 -m release -y
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::xmake configure attempt $i failed; retrying in 20s"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { Write-Host "::error::xmake configure failed after 8 attempts"; exit 1 }

          xmake build HeapSentinel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse -Filter HeapSentinel.dll | Select-Object FullName, Length

      - name: Assert the artifact carries the work
        shell: bash
        run: |
          set -euo pipefail
          dll=$(find build -name HeapSentinel.dll | head -1)
          [ -n "$dll" ] || { echo "::error::HeapSentinel.dll was not built"; exit 1; }
          test -s "$dll" || { echo "::error::the built DLL is empty"; exit 1; }

          # A green build must not come from a stub: the plugin name, the
          # config section and the report kinds have to be in the binary.
          for needle in "HeapSentinel" "GuardPool" "RefCountGuard" "ScaleformHeap" "WeakLib" "bad-vtable-release" "double-free" "VERDICT" "PoisonOnFree" "GFxResourceWeakLib::PinResource" "GFxResourceWeakLib::RemoveResourceOnRelease"; do
            strings -n 5 "$dll" | grep -q "$needle" || { echo "::error::$needle missing from the DLL"; exit 1; }
          done
          echo "the DLL contains the plugin name, config sections and report kinds"

          sha256sum "$dll"

      - name: Package the mod archive
        shell: bash
        run: |
          set -euo pipefail
          dll=$(find build -name HeapSentinel.dll | head -1)
          mkdir -p out/SKSE/Plugins
          cp "$dll" out/SKSE/Plugins/HeapSentinel.dll
          cp config/HeapSentinel.ini out/SKSE/Plugins/HeapSentinel.ini
          cp README.md RESEARCH.md DESIGN.md out/
          # Data at the archive root so Amethyst / MO2 / Vortex install it as a
          # mod with no manual placement.
          ( cd out && 7z a -bd -y ../HeapSentinel-0.3.0.zip . >/dev/null )
          ls -l HeapSentinel-0.3.0.zip
          7z l HeapSentinel-0.3.0.zip | tr '\\' '/' | grep -q "SKSE/Plugins/HeapSentinel.dll" || { echo "::error::the DLL is missing from the archive"; exit 1; }
          7z l HeapSentinel-0.3.0.zip | tr '\\' '/' | grep -q "SKSE/Plugins/HeapSentinel.ini" || { echo "::error::the config is missing from the archive"; exit 1; }
          sha256sum HeapSentinel-0.3.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HeapSentinel
          path: |
            **/HeapSentinel.dll
            HeapSentinel-0.3.0.zip

      - name: Attach to a release when tagging
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HeapSentinel-0.3.0.zip
            **/HeapSentinel.dll
          body: |
            HeapSentinel - an SKSE plugin that retrofits a memory sentinel onto
            a running Skyrim SE/AE process: a shadow allocation ledger on the
            engine's MemoryManager, a GWP-ASan-style sampled guarded pool, and a
            GRefCountImpl::Release vtable guard that can fail safe instead of
            crashing. See RESEARCH.md and DESIGN.md.

  # The shared-memory IPC layer (src/Ipc) is plain C++ with no Windows
  # dependency, so it is built and RUN on both platforms. That is the point:
  # running the same layout static_asserts under MSVC and under GCC is what
  # makes "the plugin and the helper agree on the layout" a checked claim
  # rather than an assumption about one compiler.
  tests:
    name: off-game tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          # tests/ is its own xmake project (the plugin is Windows-only), and
          # xmake takes the action BEFORE -P.
          xmake f -P tests -p ${{ matrix.platform }} -m release -y

      - name: Build the test binary
        shell: bash
        run: |
          set -euo pipefail
          xmake build -P tests -y

      - name: Run the off-game test suite
        shell: bash
        run: |
          set -euo pipefail
          xmake run -P tests 2>&1 | tee tests.out

          # A green run is only meaningful if it actually ran something, so the
          # contract is asserted rather than trusted: zero failures AND a
          # non-trivial number of checks. A runner that silently ran no tests
          # would otherwise look exactly like success.
          grep -qE '0 failure\(s\)' tests.out || { echo "::error::the suite reported failures"; exit 1; }
          checks=$(sed -nE 's/.*[0-9]+ test\(s\) run, ([0-9]+) check\(s\).*/\1/p' tests.out | tail -1)
          echo "checks executed: ${checks:-<none>}"
          test -n "$checks" || { echo "::error::could not read the check count"; exit 1; }
          test "$checks" -gt 5000 || { echo "::error::only $checks checks ran - the suite did not really execute"; exit 1; }

  # ASan + UBSan on the off-game suite. A SEPARATE job so a sanitizer finding is
  # attributable to the sanitizer rather than conflated with the plain run.
  #
  # TSan is deliberately NOT enabled: it does not understand seqlocks, and the
  # per-entry seqlock and the lock-free rings read/write payload fields
  # non-atomically by design, so TSan would flag every one of them and drown the
  # real signal. Adding it later needs suppressions/annotations and is a
  # deliberate separate decision.
  sanitize:
    name: off-game tests (asan+ubsan, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure with ASan+UBSan
        shell: bash
        run: |
          set -euo pipefail
          xmake f -P tests -p ${{ matrix.platform }} -m debug \
            --cxflags="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            --ldflags="-fsanitize=address,undefined" -y

      - name: Build
        shell: bash
        run: xmake build -P tests -y

      - name: Run under ASan+UBSan (errors fatal)
        shell: bash
        run: |
          set -euo pipefail
          # Leak detection is OFF ON PURPOSE: the harness and the cores keep
          # singleton state alive for the whole process by design, so LSAN would
          # report those as leaks and drown the signal. ASan AND UBSan errors are
          # fatal (halt_on_error=1), so a real finding fails the job, and
          # pipefail propagates a sanitizer abort through tee.
          export ASAN_OPTIONS=halt_on_error=1:abort_on_error=1:detect_leaks=0:print_stacktrace=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          xmake run -P tests 2>&1 | tee sanitize.out
          grep -qE '0 failure\(s\)' sanitize.out || { echo "::error::the sanitized suite reported failures"; exit 1; }

  # ===========================================================================
  # FOMOD INSTALLER (feat/fomod-installer)
  # ===========================================================================
  # ONE self-contained job, APPENDED so a concurrent branch that also edits this
  # file merges mechanically (if both append at EOF, expect a trivial rebase).
  #
  # It validates the FOMOD with tools/validate_fomod.py -- a real gate that can
  # and has been seen to fail: a renamed ini key, a stale profile, or a
  # <file source> that does not exist all turn this job red. On a tag it builds
  # the installable zip and attaches it as the release asset. The loose files
  # (SKSE/Plugins/HeapSentinel.dll + the flat archive) stay on the `HeapSentinel`
  # artifact from the `build` job for manual install.
  fomod:
    name: FOMOD package + validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the built DLL
        uses: actions/download-artifact@v4
        with:
          name: HeapSentinel
          path: artifact

      - name: Locate the DLL and read the version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          dll=$(find artifact -name HeapSentinel.dll | head -1)
          [ -n "$dll" ] || { echo "::error::no HeapSentinel.dll in the downloaded artifact"; exit 1; }
          test -s "$dll" || { echo "::error::the downloaded DLL is empty"; exit 1; }
          version=$(grep -oP 'set_version\("\K[^"]+' xmake.lua)
          [ -n "$version" ] || { echo "::error::could not read the version from xmake.lua"; exit 1; }
          echo "dll=$dll" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "using $dll for HeapSentinel $version"
          sha256sum "$dll"

      - name: Install xmllint for FOMOD schema validation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
          xmllint --version

      - name: Validate the FOMOD and build the archive
        shell: bash
        run: |
          set -euo pipefail
          # Exit non-zero on any failure: stale generated files, an ini key the
          # plugin does not parse, invalid XML, a missing <file source>, or a
          # profile whose conditional-install flag resolves to the wrong ini.
          python3 tools/validate_fomod.py \
            --dll "${{ steps.vars.outputs.dll }}" \
            --zip "HeapSentinel-${{ steps.vars.outputs.version }}-fomod.zip" \
            --stage stage-fomod

      - name: Assert the archive shape
        shell: bash
        run: |
          set -euo pipefail
          zip="HeapSentinel-${{ steps.vars.outputs.version }}-fomod.zip"
          for f in fomod/ModuleConfig.xml fomod/info.xml SKSE/Plugins/HeapSentinel.dll; do
            unzip -Z1 "$zip" | grep -qxF "$f" || { echo "::error::$f missing from $zip"; exit 1; }
          done
          unzip -Z1 "$zip" | grep -qE '^fomod/profiles/[^/]+\.ini$' || { echo "::error::no profile inis in $zip"; exit 1; }
          echo "archive shape ok"
          sha256sum "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HeapSentinel-FOMOD
          path: "*-fomod.zip"

      - name: Attach the FOMOD to a release when tagging
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*-fomod.zip"
          body: |
            HeapSentinel FOMOD for SKSE (Skyrim SE/AE, Address Library).

            HeapSentinel is an SKSE plugin that retrofits a memory sentinel onto
            the running game. It does NOT fix crashes: it tells you WHICH MOD
            caused one. Install with Amethyst: Mods -> Install mod from file...,
            then pick a memory/attribution profile in the wizard. The
            recommended "Balanced" profile costs roughly 260 MiB of resident
            memory; every profile states its own cost in the wizard.

            Nothing leaves the machine. The loose SKSE/Plugins/HeapSentinel.dll
            and the flat archive remain on the CI artifact for manual install.
